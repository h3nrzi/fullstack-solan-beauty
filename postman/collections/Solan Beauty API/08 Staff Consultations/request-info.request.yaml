$kind: http-request
name: Request Info from Customer
method: POST
url: '{{baseUrl}}/api/admin/consultations/{{consultationId}}/request-info'
order: 4000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: consultationId
    value: '{{consultationId}}'
body:
  type: json
  content: |-
    {
      "question": "What is your current hair condition and any previous treatments?"
    }
