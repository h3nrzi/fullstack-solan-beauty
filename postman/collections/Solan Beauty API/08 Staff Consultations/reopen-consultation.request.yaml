$kind: http-request
name: Reopen Consultation
method: POST
url: '{{baseUrl}}/api/admin/consultations/{{consultationId}}/reopen'
order: 7000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: consultationId
    value: '{{consultationId}}'
body:
  type: json
  content: |-
    {
      "reason": "Customer requested additional changes to the proposal",
      "assignedStaffId": "{{staffId}}"
    }
