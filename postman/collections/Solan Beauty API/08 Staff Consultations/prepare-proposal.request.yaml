$kind: http-request
name: Prepare Proposal
method: POST
url: '{{baseUrl}}/api/admin/consultations/{{consultationId}}/proposal'
order: 5000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: consultationId
    value: '{{consultationId}}'
body:
  type: json
  content: |-
    {
      "proposalDetails": {
        "recommendedService": "Balayage",
        "estimatedDuration": 180,
        "estimatedPrice": 800000,
        "artistId": "{{artistId}}"
      },
      "note": "Recommended based on customer hair type"
    }
