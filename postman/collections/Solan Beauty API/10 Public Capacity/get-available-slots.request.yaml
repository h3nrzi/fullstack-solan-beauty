$kind: http-request
name: Get Available Slots
method: GET
url: '{{baseUrl}}/api/public/capacity/slots?serviceId={{serviceId}}&date=2026-11-10'
order: 1000
queryParams:
  - key: serviceId
    value: '{{serviceId}}'
  - key: date
    value: '2026-11-10'
  - key: artistId
    value: '{{artistId}}'
    disabled: true
