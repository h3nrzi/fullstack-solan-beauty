$kind: http-request
name: Create Working Shift
method: POST
url: '{{baseUrl}}/api/admin/schedule/shifts'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "artistId": "{{artistId}}",
      "dayOfWeek": 1,
      "startTime": "09:00",
      "endTime": "17:00",
      "isActive": true
    }
